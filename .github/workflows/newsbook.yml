name: Bản tin hằng ngày
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = chạy đầy đủ | check-feeds = chỉ kiểm tra nguồn tin"
        type: choice
        options: [run, check-feeds]
        default: run
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Tạo bản tin và đẩy lên Google Drive
        run: python main.py --out-dir out ${{ inputs.mode == 'check-feeds' && '--check-feeds' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      - name: Lưu bản EPUB dự phòng 7 ngày
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epub
          path: out/*.epub
          retention-days: 7
          if-no-files-found: ignore
